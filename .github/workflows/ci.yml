name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [develop, main]

env:
  FVM_VERSION: 3.35.5

jobs:
  # ── Phase A: Quality Gate (every push) ────────────────────────────────────
  quality-gate:
    name: Format & Analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup FVM + Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FVM_VERSION }}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run code generation
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib/ test/

      - name: Analyze
        run: flutter analyze --no-fatal-infos

  # ── Phase A: Tests (every push) ───────────────────────────────────────────
  test:
    name: Tests
    runs-on: ubuntu-latest
    needs: quality-gate
    steps:
      - uses: actions/checkout@v4

      - name: Setup FVM + Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FVM_VERSION }}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run code generation
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Run tests
        run: flutter test --coverage

  # ── Phase A: Migration Check (every push) ─────────────────────────────────
  migration-check:
    name: Migration Check
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Check for migration when Supabase files change
        run: |
          CHANGED=$(git diff --name-only HEAD~1 HEAD | grep -E '^(lib/core/features/.*/data/(dtos|mappers)|supabase/functions)' || true)
          if [ -n "$CHANGED" ]; then
            MIGRATIONS=$(git diff --name-only HEAD~1 HEAD | grep '^supabase/migrations/' || true)
            if [ -z "$MIGRATIONS" ]; then
              echo "⚠️  Schema-coupled files changed without a migration:"
              echo "$CHANGED"
              echo ""
              echo "If this is a schema change, run /new-migration first."
              echo "If this is NOT a schema change, this warning can be ignored."
            fi
          fi

  # ── Phase B: Build stage (develop only) ───────────────────────────────────
  build-stage:
    name: Build Stage
    runs-on: ubuntu-latest
    needs: [quality-gate, test]
    if: github.ref == 'refs/heads/develop' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Setup FVM + Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FVM_VERSION }}
          cache: true

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: flutter pub get

      - name: Build stage APK
        run: flutter build apk --flavor stage --release

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: stage-apk
          path: build/app/outputs/flutter-apk/app-stage-release.apk
          retention-days: 7

  # ── Phase B: Migrate staging (develop only) ───────────────────────────────
  migrate-stage:
    name: Migrate Staging DB
    runs-on: ubuntu-latest
    needs: [quality-gate, test]
    if: |
      github.ref == 'refs/heads/develop' &&
      github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Check for migrations
        id: check
        run: |
          if [ -d "supabase/migrations" ] && [ -n "$(ls supabase/migrations/)" ]; then
            echo "has_migrations=true" >> $GITHUB_OUTPUT
          else
            echo "has_migrations=false" >> $GITHUB_OUTPUT
          fi

      - name: Setup Supabase CLI
        if: steps.check.outputs.has_migrations == 'true'
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Push migrations to staging
        if: steps.check.outputs.has_migrations == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase db push --project-ref ${{ secrets.SUPABASE_STAGE_PROJECT_REF }}

  # ── Phase B: Build production (main only) ─────────────────────────────────
  build-prod:
    name: Build Production
    runs-on: ubuntu-latest
    needs: [quality-gate, test]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Setup FVM + Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FVM_VERSION }}
          cache: true

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: flutter pub get

      - name: Build production APK
        run: flutter build apk --flavor production --release

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: production-apk
          path: build/app/outputs/flutter-apk/app-production-release.apk
          retention-days: 14

  # ── Phase B: Migrate production (main only, manual approval) ──────────────
  migrate-prod:
    name: Migrate Production DB
    runs-on: ubuntu-latest
    needs: build-prod
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production  # requires manual approval in GitHub Environments
    steps:
      - uses: actions/checkout@v4

      - name: Check for migrations
        id: check
        run: |
          if [ -d "supabase/migrations" ] && [ -n "$(ls supabase/migrations/)" ]; then
            echo "has_migrations=true" >> $GITHUB_OUTPUT
          else
            echo "has_migrations=false" >> $GITHUB_OUTPUT
          fi

      - name: Setup Supabase CLI
        if: steps.check.outputs.has_migrations == 'true'
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Push migrations to production
        if: steps.check.outputs.has_migrations == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase db push --project-ref ${{ secrets.SUPABASE_PROD_PROJECT_REF }}

  # ── Phase C: Deploy (manual trigger only) ─────────────────────────────────
  deploy-ios-beta:
    name: Deploy iOS Beta (TestFlight)
    runs-on: macos-latest
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - name: Setup FVM + Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FVM_VERSION }}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Setup Ruby + Fastlane
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true

      - name: Deploy to TestFlight
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_API_KEY_CONTENT }}
        run: fastlane ios beta

  deploy-android-beta:
    name: Deploy Android Beta (Play Store)
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - name: Setup FVM + Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FVM_VERSION }}
          cache: true

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: flutter pub get

      - name: Setup Ruby + Fastlane
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true

      - name: Deploy to Play Store internal
        env:
          GOOGLE_PLAY_JSON_KEY: ${{ secrets.GOOGLE_PLAY_JSON_KEY }}
        run: fastlane android beta
