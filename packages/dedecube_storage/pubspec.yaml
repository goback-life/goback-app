name: dedecube_storage
description: " Dedecube Storage is a package designed to manage application data
  storage efficiently. It provides a flexible and scalable solution for handling
  local and secure storage. With seamless integration and a clean architecture
  approach, it simplifies data persistence and retrieval, ensuring reliability
  and performance."
publish_to: "none"

version: 0.0.17

environment:
  sdk: ^3.5.3
  flutter: ">=1.17.0"

dependencies:
  dedecube_core:
    path: ../dedecube_core  
  flutter:
    sdk: flutter
  flutter_secure_storage: ^9.2.4
  riverpod_annotation: ^2.6.1
  shared_preferences: ^2.5.3

dev_dependencies:
  build_runner: ^2.4.15
  custom_lint: ^0.7.5
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter
  riverpod_generator: ^2.6.5
