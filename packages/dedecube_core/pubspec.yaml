name: dedecube_core
description: "Dedecube Core is a meta-package that integrates and re-exports
  essential Dedecube libraries as startup, logger, environment, and translator
  providing a streamlined and modular foundation for scalable project
  development."
publish_to: "none"

version: 0.0.20

environment:
  sdk: ^3.5.3
  flutter: ">=1.17.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_hooks: ^0.21.2
  freezed_annotation: ^3.0.0
  get_it: ^8.0.3
  hooks_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

dev_dependencies:
  build_runner: ^2.5.4
  custom_lint: ^0.7.5
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter
  riverpod_generator: ^2.6.5
  yaml: ^3.1.3
  yaml_edit: ^2.2.2
