name: dedecube_translator
description: "A comprehensive package designed to efficiently manage and
  streamline application localization, ensuring seamless integration and ease of
  use."
publish_to: "none"

version: 0.0.15

environment:
  sdk: ^3.5.3
  flutter: ">=1.17.0"

dependencies:
  dedecube_core:
    path: ../dedecube_core
  flutter:
    sdk: flutter
  flutter_dotenv: ^5.2.1
  flutter_i18n: ^0.36.2
  flutter_localizations:
    sdk: flutter
  riverpod_annotation: ^2.6.1

dev_dependencies:
  build_runner: ^2.4.15
  custom_lint: ^0.7.5
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter
  riverpod_generator: ^2.6.5