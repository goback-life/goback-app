include: package:flutter_lints/flutter.yaml

linter:
  rules:
    - always_declare_return_types
    - always_put_control_body_on_new_line
    - always_put_required_named_parameters_first
    - always_use_package_imports
    - annotate_overrides
    - avoid_bool_literals_in_conditional_expressions
    - avoid_double_and_int_checks
    - avoid_dynamic_calls
    - avoid_empty_else
    - avoid_equals_and_hash_code_on_mutable_classes
    - avoid_escaping_inner_quotes
    - avoid_final_parameters
    - avoid_init_to_null
    - avoid_js_rounded_ints
    - avoid_multiple_declarations_per_line
    - avoid_positional_boolean_parameters
    - avoid_print
    - avoid_relative_lib_imports
    - avoid_renaming_method_parameters
    - avoid_returning_null_for_void
    - avoid_returning_this
    - avoid_shadowing_type_parameters
    - avoid_single_cascade_in_expression_statements
    - avoid_types_as_parameter_names
    - await_only_futures
    - camel_case_extensions
    - camel_case_types
    - cancel_subscriptions
    - cascade_invocations
    - cast_nullable_to_non_nullable
    - collection_methods_unrelated_type
    - combinators_ordering
    - comment_references
    - conditional_uri_does_not_exist
    - curly_braces_in_flow_control_structures
    - empty_statements
    - exhaustive_cases
    - file_names
    - implicit_call_tearoffs
    - invalid_case_patterns
    - no_self_assignments
    - non_constant_identifier_names
    - parameter_assignments
    - prefer_asserts_in_initializer_lists
    - prefer_asserts_with_message
    - prefer_collection_literals
    - prefer_conditional_assignment
    - prefer_const_constructors
    - prefer_const_declarations
    - prefer_const_literals_to_create_immutables
    - prefer_contains
    - prefer_final_fields
    - prefer_final_in_for_each
    - prefer_final_locals
    - prefer_is_empty
    - prefer_is_not_empty
    - prefer_single_quotes
    - prefer_typing_uninitialized_variables
    - sort_child_properties_last
    - sort_constructors_first
    - sort_pub_dependencies
    - use_enums
    - use_is_even_rather_than_modulo
    - use_setters_to_change_properties
    - use_super_parameters

analyzer:
  exclude:
    - "**.freezed.dart"
    - "**.g.dart"
    - "**.tailor.dart"
    - "**.gen.dart"

  plugins:
    - custom_lint

  language:
    # strict-casts: true
    # strict-inference: true
    # strict-raw-types: true

  errors:
    missing_return: error
    collection_methods_unrelated_type: warning
    unrelated_type_equality_checks: warning

custom_lint:
  rules:
    - avoid_string_literals_inside_text_widget
    - one_class_per_file
    - translation_key_does_exist:
      locales:
        it:
          - "assets/translations/it.json"
    - always_put_doc_comments_before_annotations
    - always_specify_parameter_names
    - avoid_abbreviations_in_doc_comments
    - avoid_dynamic
    - avoid_empty_blocks
    - avoid_nested_if
    - boolean_prefixes
    - max_lines_for_file:
      max_lines: 500
    - max_lines_for_function:
      max_lines: 200
    - no_duplicate_imports
    - no_self_comparisons
    - prefer_async_await
    - prefer_immediate_return
    - prefer_iterable_any
    - prefer_iterable_every
    - prefer_iterable_first
    - prefer_iterable_last
    - prefer_new_line_before_return
    - unnecessary_nullable_return_type
    - avoid_public_member_in_states
    - avoid_returning_widgets
    - avoid_single_child_flex
    - prefer_async_callback
    - prefer_border_from_border_side
    - prefer_border_radius_all
    - prefer_dedicated_media_query_functions
    - prefer_text_rich
    - prefer_void_callback
    - proper_edge_insets_constructors
    - proper_expanded_and_flexible
    - use_spacer
