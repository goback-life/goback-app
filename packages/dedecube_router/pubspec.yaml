name: dedecube_router
description: "Dedecube Router is a lightweight and flexible routing package for
  Flutter applications."
publish_to: "none"

version: 0.0.28

environment:
  sdk: ^3.5.3
  flutter: ">=1.17.0"

dependencies:
  dedecube_core:
    path: ../dedecube_core
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  go_router: ^14.8.1
  riverpod_annotation: ^2.6.1

dev_dependencies:
  build_runner: ^2.4.15
  custom_lint: ^0.7.5
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter
  riverpod_generator: ^2.6.5
